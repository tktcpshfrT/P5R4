<main><h1>詞類撈金魚</h1><div id="hud">每條魚都有一個詞類</div><div id="question" hidden></div><div id="pool"><div id="fish"></div><section id="menu"><h2>橘貓嘅金魚攤</h2><p>睇清黃色詞語，用紙網撈啱詞類嘅金魚。</p><button id="go">開始撈魚</button></section><section id="end" hidden><h2 id="rank"></h2><div id="medalFish" class="medal-fish" role="img"></div><p id="result"></p><p id="prize"></p><button id="again">再玩一次</button></section><div id="net" hidden></div></div><p id="message" aria-live="polite"></p><button id="next" hidden>下一題</button></main>
<script>
const qs=[
['【學生】在圖書館讀書。',0,'「學生」是人的名稱。'],['妹妹在紙上【寫】字。',1,'「寫」表示動作。'],['【他】正在讀書。',2,'「他」可以代替人的名稱。'],['門前有一棵【高大】的樹。',3,'「高大」形容樹的外形。'],['我【常常】到圖書館。',4,'「常常」說明動作發生的頻率。'],['我借了【三】本書。',5,'「三」表示數目。'],['我借了三【本】書。',6,'「本」是計算書的單位。'],['【早晨】的空氣很清新。',0,'「早晨」是表示時間的名詞。'],['我【喜歡】小狗。',1,'「喜歡」表示心理活動。'],['【誰】拿了這本書？',2,'「誰」是用來問人的代名詞。'],['【勤奮】的妹妹每天溫習。',3,'「勤奮」形容妹妹的特點。'],['爸爸【已經】回家了。',4,'「已經」表示動作發生的時間。'],['今年有【六十】人參加。',5,'「六十」表示數目。'],['這裏停着一【輛】房車。',6,'「輛」是計算車輛的單位。'],['牆上掛着一幅【畫】。',0,'「畫」在這句是物件的名稱。']];
const labels=['名詞','動詞','代名詞','形容詞','副詞','數詞','量詞'];
const $=id=>document.getElementById(id);
let idx=0,score=0,locked=true,fish=[],audio;
function chime(ok){try{audio??=new AudioContext();audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.frequency.setValueAtTime(ok?460:220,t);o.frequency.exponentialRampToValueAtTime(ok?820:110,t+.17);g.gain.setValueAtTime(.075,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.25)}catch{}}
function hud(){$('hud').textContent='第 '+(idx+1)+' / '+qs.length+' 題　｜　撈到 '+(idx+Number(locked))+' / '+qs.length+' 條　｜　'+score+' 分'}
function start(){idx=0;score=0;$('menu').hidden=true;$('end').hidden=true;$('question').hidden=false;show()}
function show(){locked=false;const [q,key,why]=qs[idx];$('question').innerHTML=q.replace('【','<mark>').replace('】','</mark>');$('message').textContent='';$('next').hidden=true;hud();
const order=labels.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
fish=order.map((id,i)=>{const b=document.createElement('button');b.className='swim';b.style.setProperty("--fish-art",(id%3)*50+"%");b.style.setProperty("--hue",["0deg","0deg","0deg","-21deg","36deg","0deg","-35deg"][id]);const art=document.createElement('i');art.className='goldfish';art.setAttribute('aria-hidden','true');const label=document.createElement('span');label.textContent=labels[id];b.append(art,label);b.onclick=e=>{if(locked)return;const ok=id===key;score+=ok?100:-30;chime(ok);splash(e,b);if(ok){locked=true;b.classList.add('caught');$('next').textContent=idx===qs.length-1?'看結果':'下一題';$('next').hidden=false;$('next').focus()}$('message').textContent=ok?'撈到！＋100 分　'+why:'撈錯咗！−30 分，睇清詞語再試。';hud()};return b});
$('fish').replaceChildren(...fish);swim(performance.now())}
const routes=[
 p=>[Math.sin(p),Math.sin(2*p)*.88],
 p=>[Math.cos(p),Math.sin(p)],
 p=>[Math.sin(p),Math.sin(p+.45)],
 p=>[Math.sin(2*p),Math.cos(p)],
 p=>[Math.cos(p),-Math.sin(p)],
 p=>[Math.sin(p),Math.sin(3*p)*.82],
 p=>[Math.sin(p),-Math.sin(p+.5)]
];
function swim(t){
 const area=$('fish'),cw=area.clientWidth/3,ch=area.clientHeight/3;
 fish.forEach((b,i)=>{
  const phase=t*(.00095+i*.00009)+i*1.9+idx*.81;
  const route=routes[(i+idx)%routes.length], [u,v]=route(phase);
  const travelX=Math.max(0,cw-b.offsetWidth),travelY=Math.max(0,ch-b.offsetHeight);
  const x=(i%3)*cw+(u+1)*travelX/2,y=Math.floor(i/3)*ch+(v+1)*travelY/2;
  b.style.transform='translate('+x+'px,'+y+'px)';
  b.style.setProperty('--dir',route(phase+.01)[0]>=u?1:-1);
 });
}
function tick(t){swim(t);requestAnimationFrame(tick)}requestAnimationFrame(tick);
function point(e,b){const p=$('pool').getBoundingClientRect(),r=b.getBoundingClientRect();return [e.detail?e.clientX-p.left:r.left+r.width/2-p.left,e.detail?e.clientY-p.top:r.top+r.height/2-p.top]}
function splash(e,b){const [x,y]=point(e,b);for(const delay of [0,95]){const s=document.createElement('i');s.className='splash';Object.assign(s.style,{left:x+'px',top:y+'px',animationDelay:delay+'ms'});$('pool').append(s);s.onanimationend=()=>s.remove()}}
$('pool').onpointermove=e=>{if(!fish.length||e.pointerType==='touch')return;const r=$('pool').getBoundingClientRect(),n=$('net');n.hidden=false;Object.assign(n.style,{left:e.clientX-r.left+'px',top:e.clientY-r.top+'px'})};$('pool').onpointerleave=()=>$('net').hidden=true;
$('go').onclick=$('again').onclick=start;$('next').onclick=()=>{idx++;if(idx<qs.length){show();return}fish=[];$('fish').replaceChildren();$('net').hidden=true;$('next').hidden=true;$('question').hidden=true;$('message').textContent='';$('end').hidden=false;const n=score>=1200?3:score>=900?2:1;$('rank').textContent=['','🥉 銅獎','🥈 銀獎','🥇 金獎'][n];$('result').textContent='撈到 15 條金魚　｜　總分 '+score+' / 1500';const gift=['','銅魚','銀魚','金魚'][n];$('medalFish').style.setProperty('--fish-art',((3-n)*50)+'%');$('medalFish').setAttribute('aria-label',gift);$('prize').textContent='獲得'+gift+'，可向老師換 '+n+' 個印' };
</script></html>
